# PAUSE SWITCH: true = do nothing (no watching, recording, clipping or Claude calls).
# Set back to false to start again.
paused: true

# ---------------------------------------------------------------
# Auto Clipper settings. Edit this file, commit, and the next
# scheduled run picks it up.
# ---------------------------------------------------------------

# Channels / playlists to watch. New uploads get clipped automatically.
# Only list content you have permission to clip (your own, or a
# clipping campaign that allows it).
#   https://www.youtube.com/@Creator          -> uploads AND past live streams
#   https://www.youtube.com/@Creator/streams  -> only past live streams
#   https://www.twitch.tv/creator             -> past Twitch broadcasts (VODs)
#   https://www.youtube.com/playlist?list=... -> a playlist
#
# A source can also carry campaign rules:
#   name:     must appear in every caption (added automatically if missing)
#   hashtags: always included in the caption
#   notes:    extra instructions for picking moments
#   overlay:  small text shown on the video the whole time (e.g. a required @handle)
#   reminder: shown in Telegram with each batch of clips
#   since:    only clip videos recorded on/after this date (YYYY-MM-DD)
#   layout:   force a layout for this streamer (split / crop / blur / auto)
#   webcam:   [x, y, w, h] fractions of the screen where the webcam overlay sits
#   single_stream: true = a one-off stream (marathon): stop watching once it's fully clipped
#   live:     true = record the stream while it's live and clip every hour (live.yml)
#   require_game: only keep clips where this game is on screen (checked from 3 frames)
#   auto:     false = don't watch this channel; only clip links you run by hand
sources:
  # Reach: $5,000 Clix GTA VI Marathon Pool (split by views, paid when the pool ends)
  # Rules: https://reachclipping.com/ClixGTA
  - url: https://www.twitch.tv/clix
    name: Clix
    since: 2026-11-18      # only footage from Nov 18 on (the GTA marathon and after)
    layout: split          # webcam on top, gameplay below
    webcam: [0, 0, 0.248, 0.247]   # his webcam box: left 25% x top 25% of the screen
    live: true             # record his streams while they're live, clip every hour
    require_game: GTA 6    # gameplay only: Claude checks 3 frames per clip, drops IRL / chatting
    hashtags: ["#Clix", "#GTA6"]
    notes: >
      Only clip his GTA 6 gameplay. Clix must be the main subject of every clip:
      pick moments where Clix himself is talking, reacting or doing something,
      not moments that are mostly about other people.
    reminder: >
      Clix campaign: submit each clip link on Content Rewards within 30 minutes of
      posting. Your audience must be mostly US/CA/UK/AU/NZ. One strike bans you
      from all Reach campaigns, so follow the rules exactly.

  # Reach: SypherPK $7,500 campaign ($2 per 1K views, $20 min / $500 max payout).
  # Only VODs from the November 15 stream (Sypher, Replays or Maddynf) count, so
  # this channel is not watched automatically: run those VOD links by hand.
  - url: https://www.twitch.tv/sypherpk
    name: SypherPK
    layout: split
    hashtags: ["#SypherPK", "#fortnitecreative", "#uefn"]   # required by the campaign
    auto: false
    notes: >
      Campaign rules: Sypher, Replays and Maddynf playing together must be the main
      focus of every clip. Never show Sypher, Replays, Maddynf, Fortnite, Epic Games
      or UEFN in a negative light (no mocking players or the game), and no negative
      or false narratives. English only.
    reminder: >
      SypherPK campaign: submit each clip link on Content Rewards. Captions must keep
      #fortnitecreative #uefn and a creator name. Payout starts at 10,000 views.

# How many of the newest uploads to look at per source each run.
lookback_videos: 3
# Max videos to process in one run (keeps runs under the time limit).
max_videos_per_run: 2
# Skip videos shorter than this (minutes). Avoids re-clipping Shorts.
min_source_minutes: 5

# Clip selection
clips_per_video: 5
min_clip_seconds: 15
max_clip_seconds: 50
# Tell the AI what your audience likes. Shapes which moments it picks.
niche_notes: >
  Gaming stream clips (GTA 6 and other games) for TikTok, YouTube Shorts and Reels.
  Viewers want: the streamer's funniest or most heated reactions, chaotic moments
  (chases, crashes, police, fails, wild NPC encounters), first reactions to new
  features or locations, clutch wins and big rage moments, and banter that's funny
  with no context. The first 2 seconds must already be loud, funny or surprising.
  Avoid menus, loading screens, reading chat, sponsor reads and long quiet stretches.

model: claude-sonnet-5-5       # picks the moments (Sonnet: half Opus's price, still sharp)
effort: medium
check_model: claude-haiku-5-5   # cheap model for the "is this gameplay?" frame check
max_height: 1080                # download resolution

# Live streams (anything longer than long_video_minutes counts as a stream).
# Streams are clipped once the VOD is up. Live Twitch marathons are clipped while they run,
# one finished part at a time.
long_video_minutes: 90
stream_clips_per_hour: 4     # at most this many clips per hour of stream
max_clips_per_video: 15
min_score: 7                 # only send moments Claude rates 7/10 or higher (strict rubric: 7 = strong)
min_words_per_minute: 20     # less talking than this in an hour = on a break (asleep, BRB): skip it

# Daily "top picks" message in Telegram (your local time)
digest_hour: 12
digest_count: 6
utc_offset_hours: 3
max_stream_hours: 8          # streams longer than this are clipped in parts
stream_part_hours: 1         # part length; live Twitch marathons are clipped as each hour finishes
stream_whisper_model: base   # faster model so long streams fit in one run

# Transcription (faster-whisper). tiny/base/small/medium. Bigger = slower + better.
whisper_model: small
language: null        # e.g. "en" to force; null = auto-detect

# Video layout
#   auto  -> follow the speaker's face; falls back to "blur" when no face is found
#   crop  -> always center-crop
#   auto  -> also switches to "split" when it sees a small webcam in a corner
#   split -> webcam on top, gameplay below (gaming / reaction streams)
#   blur  -> full frame on a blurred background (good for screen recordings)
layout: auto

# Captions
captions:
  enabled: true
  font: DejaVu Sans
  font_size: 78
  words_per_line: 3
  uppercase: true
  show_title: true          # hook title box at the top of the clip
  color: "FFFFFF"           # RRGGBB
  highlight_color: "00E5FF" # current word
  outline: 5
  position_from_bottom: 520 # pixels from bottom of the 1080x1920 frame

output_dir: output
