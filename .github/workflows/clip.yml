name: Auto Clip
run-name: >-
  ${{ github.event_name == 'push' && github.event.head_commit.message
  || inputs.urls != '' && format('✂️ {0}: {1}', inputs.campaign != 'auto-detect' && inputs.campaign || 'Clip', inputs.urls)
  || (github.event_name == 'schedule' && '⏰ Clix: hourly check'
  || '🔎 Clix: check now') }}

on:
  # Claude starts runs by committing a link to requests/run.txt
  # (format: "<campaign or auto-detect> <url> [more urls]")
  push:
    branches: [main]
    paths: ["requests/run.txt"]
  schedule:
    - cron: "17 * * * *"   # every hour (repo is public, so Actions minutes are free)
  workflow_dispatch:
    inputs:
      urls:
        description: "Video URL(s) to clip right now, space-separated. Leave empty to check your sources."
        required: false
        default: ""
      campaign:
        description: "Which campaign the pasted link(s) belong to (sets the run name and the caption rules)"
        type: choice
        options:
          - auto-detect
          - SypherPK
          - Clix
        default: auto-detect
      clips:
        description: "How many clips per video (empty = config.yaml value)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # lets a run start the next one while a marathon still has hours to clip

# Hourly checks share one lane, so the same stream is never clipped twice at once.
# Runs where you paste video URLs get their own lane and run in parallel.
concurrency:
  group: ${{ (inputs.urls != '' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[watched]'))) && format('clipper-manual-{0}', github.run_id) || 'clipper-auto' }}
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Read the request file (runs started by Claude)
        if: github.event_name == 'push'
        run: |
          line=$(grep -v '^#' requests/run.txt | grep -v '^\s*$' | head -1)
          echo "REQ_CAMPAIGN=$(echo "$line" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "REQ_URLS=$(echo "$line" | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      - name: Find moments, cut and caption clips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          RUN_BUDGET_MINUTES: "320"
          PYTHONUNBUFFERED: "1"   # show progress in the log as it happens
          URLS: ${{ inputs.urls }}
          CLIPS: ${{ inputs.clips }}
          CAMPAIGN: ${{ inputs.campaign }}
        run: |
          EXTRA=""
          URLS="${URLS:-$REQ_URLS}"
          CAMPAIGN="${CAMPAIGN:-$REQ_CAMPAIGN}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$REQ_CAMPAIGN" = "watched" ]; then
            URLS=""; CAMPAIGN=""   # "watched" = check the auto-watched streamers now
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -z "$URLS" ]; then
            echo "Request file has no link in it, nothing to do."; echo "[]" > .last_run.json; exit 0
          fi
          if [ -n "$CLIPS" ]; then EXTRA="--clips $CLIPS"; fi
          if [ -n "$CAMPAIGN" ] && [ "$CAMPAIGN" != "auto-detect" ]; then EXTRA="$EXTRA --campaign $CAMPAIGN"; fi
          if [ -n "$URLS" ]; then
            python -m clipper $EXTRA url $URLS
          else
            python -m clipper $EXTRA run
          fi

      - name: Publish clips as GitHub releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=0
          [ -f .last_run.json ] || exit 0
          for dir in $(python -c "import json;print(' '.join(json.load(open('.last_run.json'))))"); do
            i=$((i+1))
            ls "$dir"/*.mp4 >/dev/null 2>&1 || continue
            title=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['title'][:100])" "$dir/manifest.json")
            {
              echo "Clips from: $title"
              echo
              for t in "$dir"/*.txt; do echo "### $(basename "${t%.txt}")"; echo; cat "$t"; echo; done
            } > notes.md
            gh release create "clips-${GITHUB_RUN_ID}-${i}" "$dir"/*.mp4 "$dir"/*.txt \
              --title "✂️ $title" --notes-file notes.md
          done

      - name: Remember processed videos
        if: always()
        run: |
          git config user.name "auto-clipper"
          git config user.email "auto-clipper@users.noreply.github.com"
          [ -f state/processed.json ] || exit 0
          cp state/processed.json /tmp/mine.json
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git show origin/main:state/processed.json > /tmp/remote.json 2>/dev/null || echo '{}' > /tmp/remote.json
            cp /tmp/mine.json state/processed.json
            python scripts/save_state.py /tmp/remote.json state/processed.json
            git add state/processed.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Update processed videos"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not save progress after 5 tries" && exit 1

      - name: Keep going if a stream still has hours to clip
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's hourly schedule can be late or skipped. If this run clipped
          # something and a long stream still has parts waiting, start the next
          # run right away. (Stops by itself once everything is caught up.)
          clipped=$(python -c "import json;print(len(json.load(open('.last_run.json'))))" 2>/dev/null || echo 0)
          pending=$(python -c "import json;print(len(json.load(open('state/processed.json')).get('partial',{})))" 2>/dev/null || echo 0)
          echo "clipped=$clipped pending=$pending"
          if [ "$clipped" -gt 0 ] && [ "$pending" -gt 0 ]; then
            gh workflow run clip.yml --ref main && echo "Started the next run"
          fi

